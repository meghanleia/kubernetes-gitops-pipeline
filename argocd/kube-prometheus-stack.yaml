apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.io'
    chart: kube-prometheus-stack
    targetRevision: 69.2.1
    
    helm:
      valueFiles:
        - '$my-git-repo/helm-charts/kube-prometheus-stack/values.yaml'
  
  # 3. This section links your external GitHub values repo to the Helm source
  sources:
    - repoURL: 'https://github.com/meghanleia/kubernetes-gitops-pipeline'
      targetRevision: HEAD
      ref: my-git-repo

  destination:
    server: 'https://default.svc'
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true 
      - Replace=true
