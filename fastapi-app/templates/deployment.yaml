apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fastapi-app
  name: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  strategy: {}
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
      - image: fastapi-app:1.0.0-dev
        imagePullPolicy: IfNotPresent
        name: fastapi-app
        resources:
          resources:
          requests:
            memory: "64Mi" 
            cpu: "100m"  
          limits:
            memory: "128Mi" 
            cpu: "500m"   

        livenessProbe:
          httpGet:
            path: /      
            port: 8000   
          initialDelaySeconds: 5  
          periodSeconds: 10      

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
status: {}
