name: PR Merge Build and Push

on: 
  push:
    branches:
      - main
    paths:
      - 'app/**' #Only build a new image with changes to the app or tests
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fastapi-app

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "app/uv.lock"

      - name: Install dependencies
        run: uv sync --project app --frozen
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: metadata-tags
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
      
      - name: Build and push
        id: push-image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata-tags.outputs.tags }}
          labels: ${{ steps.metadata-tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
      
      # - name: Generate artifact attestation
      #   uses: actions/attest@v4.2.2
      #   with:
      #     subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
      #     subject-digest: ${{ steps.push-image.outputs.digest }}
      #     push-to-registry: true
