name: PR Stage Validate

on:
  pull_request:
    branches:
      - main
    types:
      - opened

jobs:
  pr-stage-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "app/uv.lock"

      - name: Install dependencies
        run: uv sync --project app --frozen

      - name: Lint with flake8
        working-directory: app
        run: |
          uv run --project app flake8 app/src app/tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
      - name: Test with pytest
        run: uv run --project app pytest app/tests
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Docker Build Check
        run: docker build --check -f ./app/Dockerfile .
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Helm Template Dry Run
        run: |
          helm template fastapi-app ./helm-charts/fastapi-app \
            --values ./helm-charts/fastapi-app/values.yaml \
            --debug

            